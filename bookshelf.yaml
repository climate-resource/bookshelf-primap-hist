    - methane
    - nitrous-oxide
    - f-gases
    - emissions
    - country-reported
    - historical
  update_cadence: annual

defaults:
  title: PRIMAP-hist
  description: >-
    National historical greenhouse gas emissions for every country and Kyoto gas from 1750,
    combining country reported inventories with third party data to fill the gaps.
    The data resolves the main IPCC 2006 categories,
    and carries a country reported priority scenario and a third party priority scenario.
    LULUCF emissions are not included.
  publisher: Climate Resource
  publisher_url: https://www.climate-resource.com/
  homepage_url: https://primap.org/primap-hist/
  documentation_url: https://primap.org/primap-hist/
  methodology_url: https://doi.org/10.5194/essd-8-571-2016
  repository_url: https://github.com/JGuetschow/PRIMAP-hist
  citation: >-
    Gütschow, J.; Jeffery, L.; Gieseke, R.; Gebel, R.; Stevens, D.; Krapp, M.; Rocha, M. (2016):
    The PRIMAP-hist national historical emissions time series,
    Earth Syst. Sci. Data, 8, 571-603, doi:10.5194/essd-8-571-2016.
    Cite the DOI of the precise dataset version used as well.
  intended_uses: >-
    Country level historical emissions by gas and sector for climate policy analysis,
    target tracking and as a harmonised input to other datasets.
  limitations: >-
    The uncertainties of the underlying inventories do not justify the significant digits carried,
    so small differences between countries or years are not meaningful.
    The most recent year is extrapolated where no reported or third party data exist.
    Read the uncertainties and limitations sections of the methodology paper before use.
  authors:
    - name: Gütschow, Johannes
      orcid: 0000-0001-9944-3685
      affiliation: Climate Resource
    - name: Busch, Daniel
      affiliation: Climate Resource
    - name: Pflüger, Mika
      orcid: 0000-0002-7814-8916
      affiliation: Climate Resource
  visibility: public
  resources:
    raw:
      type: tabular

build:
  notebook: build.py

