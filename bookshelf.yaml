    release_date: 2024-09-13
    release_url: https://zenodo.org/records/13752654
    description: >-
      Covers 1750 to 2023.
      Country reported data are the annual CRF submissions for Annex I parties
      and the UNFCCC DI portal plus BUR, NC and NIR submissions for non Annex I parties.
      Gaps are filled from CDIAC, EI, Andrew cement, FAOSTAT, EDGAR v8.0 and EDGAR v7.0.
